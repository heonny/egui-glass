name: Publish to crates.io

# Tag a release (`git tag v0.1.0 && git push origin v0.1.0`) to publish the
# library. Needs the CARGO_REGISTRY_TOKEN repository secret (crates.io API
# token with the publish-new / publish-update scopes).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches the crate version
        run: |
          version="$(grep '^version' crates/egui_glass/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          [ "v$version" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != crate version $version"; exit 1; }
      - run: cargo test -p egui_glass --locked
      - run: cargo test -p egui_glass --all-features --locked
      - run: cargo doc -p egui_glass --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings -D missing-docs
      - run: cmp LICENSE crates/egui_glass/LICENSE
      - run: cargo publish -p egui_glass --dry-run --locked
      - run: cargo publish -p egui_glass --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
